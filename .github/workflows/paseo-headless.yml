name: Paseo headless

on:
  pull_request:
    paths:
      - '.github/workflows/paseo-headless.yml'
      - 'config/agents/paseo/**'
      - 'dev/build-paseo-headless.sh'
      - 'tests/native/paseo-headless.sh'
  push:
    branches:
      - '**'
    paths:
      - '.github/workflows/paseo-headless.yml'
      - 'config/agents/paseo/**'
      - 'dev/build-paseo-headless.sh'
      - 'tests/native/paseo-headless.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # Include slow public downloads and all bounded network retries.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Install native bundle tools
        run: sudo apt-get update -qq && sudo apt-get install -y binutils build-essential jq xz-utils
      - name: Cache pinned npm downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .build/paseo-npm-cache
          key: paseo-npm-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('config/agents/paseo/bundle/package-lock.json', 'dev/build-paseo-headless.sh') }}
          restore-keys: paseo-npm-${{ runner.os }}-${{ matrix.arch }}-
      - name: Build and smoke-test deploy closure
        run: |
          artifact="$(dev/build-paseo-headless.sh --arch "${{ matrix.arch }}")"
          tests/native/paseo-headless.sh --artifact "$artifact"
      - name: Preserve failed Paseo download diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: paseo-diagnostics-${{ matrix.arch }}-${{ github.run_attempt }}
          path: .build/paseo-diagnostics/
          retention-days: 7
          if-no-files-found: ignore
