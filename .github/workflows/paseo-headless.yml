name: Paseo headless

on:
  pull_request:
    paths:
      - '.github/workflows/paseo-headless.yml'
      - 'config/agents/paseo/**'
      - 'dev/build-paseo-headless.sh'
      - 'scripts/lib/producer-run.py'
      - 'tests/native/paseo-headless.sh'
  push:
    branches:
      - '**'
    paths:
      - '.github/workflows/paseo-headless.yml'
      - 'config/agents/paseo/**'
      - 'dev/build-paseo-headless.sh'
      - 'scripts/lib/producer-run.py'
      - 'tests/native/paseo-headless.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # Include slow public downloads and all bounded network retries.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Install native bundle tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y binutils build-essential jq xz-utils
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          unshare --user --map-root-user --mount --pid --fork --kill-child=SIGKILL true
      - name: Build and smoke-test deploy closure
        run: |
          artifact="$(dev/build-paseo-headless.sh --arch "${{ matrix.arch }}")"
          tests/native/paseo-headless.sh --artifact "$artifact"
