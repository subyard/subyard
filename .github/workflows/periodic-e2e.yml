name: Periodic E2E
run-name: >-
  ${{ inputs.origin && format('Nested VM checks on Intel, attempt {0}, for run {1}', inputs.attempt, inputs.origin)
  || (github.event_name == 'push' && github.event.head_commit.message) || github.workflow }}

# Periodic full end-to-end run: the long VM checks of release acceptance on hosted runners, so
# their failures surface between releases. A red check here is a finding to fix early; this
# workflow does not replace release acceptance. It holds no secrets and never
# runs pull request code, because the jobs run the checked out source as root.
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
    inputs:
      checks:
        description: Space-separated check ids to run instead of all
        type: string
        default: ''
      # Set by the reschedule job, which runs nested VM checks again until they land on Intel.
      # A retry tests the branch's latest commit, like any run that starts then.
      origin:
        description: Run whose nested VM checks this run retries
        type: string
        default: ''
      attempt:
        description: Retry attempt of the nested VM checks
        type: number
        default: 0
  push:
    branches:
      - 'ci-probe/**'

permissions:
  contents: read

concurrency:
  group: periodic-e2e-${{ github.ref }}${{ inputs.origin && format('-retry-{0}', inputs.origin) || '' }}
  # A new run replaces the previous one; retries always finish. A run still going when the next
  # schedule starts six hours later is stuck, and keeping it would hold the group forever.
  cancel-in-progress: ${{ !inputs.origin }}

env:
  CANDIDATE_VERSION: 1.0.0-ci.periodic-e2e
  # A retry runs each nested VM check on this many runners at once. Intel's share of hosted
  # runners varies from about one in four to one in twenty, so a single copy may need dozens of
  # retries; a second copy on Intel only repeats the check.
  NESTED_COPIES: 3
  NESTED_ATTEMPTS: 30

jobs:
  # The schedule runs only for a commit no finished push or scheduled run has covered; a cancelled
  # run covers nothing. A failed commit is not repeated automatically; use Re-run or a manual
  # dispatch.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      run: ${{ steps.compare.outputs.run }}
    steps:
      - name: Compare with the last finished run
        id: compare
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref_name }}
          HEAD: ${{ github.sha }}
        run: |
          run=true
          if [ "$EVENT" = schedule ]; then
            last="$(gh run list --workflow periodic-e2e.yml --branch "$REF" --status completed \
              --limit 30 --json headSha,event,conclusion \
              --jq 'map(select((.event == "schedule" or .event == "push") and .conclusion != "cancelled"))[0].headSha // ""')"
            [ "$last" != "$HEAD" ] || run=false
          fi
          printf 'run=%s\n' "$run" >> "$GITHUB_OUTPUT"

  candidate:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      checks: ${{ steps.plan.outputs.checks }}
      nested: ${{ steps.plan.outputs.nested }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install packaging tools
        run: sudo apt-get update -qq && sudo apt-get install -y binutils jq ripgrep
      - name: Freeze the candidate
        run: python3 dev/release-acceptance.py prepare --version "$CANDIDATE_VERSION" --output .build/candidate
      - name: Plan the checks from their owners
        id: plan
        env:
          ONLY: ${{ inputs.checks }}
          RETRY: ${{ inputs.origin }}
        run: |
          plan="$(python3 -B dev/ci/plan-periodic-checks.py)"
          if [ -n "$ONLY" ]; then
            plan="$(jq -c --arg only "$ONLY" '($only | split(" ") | map(select(. != ""))) as $ids
              | map_values(.include |= map(select(.id as $id | $ids | index($id))))' <<<"$plan")"
            [ "$(jq '[.[].include[]] | length' <<<"$plan")" -gt 0 ] || { echo "no such checks: $ONLY"; exit 1; }
          fi
          if [ -n "$RETRY" ]; then
            plan="$(jq -c --argjson copies "$NESTED_COPIES" \
              '.nested.include |= [.[] as $check | range(1; $copies + 1) | $check + {copy: .}]' <<<"$plan")"
          fi
          # An empty matrix fails its job, so an empty list skips the job instead.
          for kind in checks nested; do
            printf '%s=%s\n' "$kind" "$(jq -c --arg kind "$kind" '.[$kind] | select(.include != [])' <<<"$plan")" \
              >> "$GITHUB_OUTPUT"
          done
          {
            echo '### Checks'
            jq -r '.checks.include[].id' <<<"$plan"
            echo '### Nested VM checks, only on Intel runners'
            jq -r '.nested.include[].id' <<<"$plan" | uniq
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: candidate-bundle
          path: .build/candidate/candidate-bundle.tar.gz
          compression-level: 0
          retention-days: 2
          if-no-files-found: error

  # One real lease first: if the pool cannot run here, the matrix would only repeat that failure.
  # A retry already passed it in its original run.
  pool:
    needs: candidate
    if: ${{ !inputs.origin }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: candidate-bundle
          path: ${{ runner.temp }}/candidate
      - name: Install the pool and hold one lease
        run: >-
          bash dev/ci/periodic-e2e.sh check pool-boundary
          "$RUNNER_TEMP/candidate/candidate-bundle.tar.gz"
          bash dev/e2e/p0-acceptance.sh --lane boundary --slot 1

  check:
    name: ${{ matrix.id }}
    needs: [candidate, pool]
    if: ${{ needs.candidate.outputs.checks && needs.pool.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      # With the nested jobs, leaves room in the account-wide 20-job pool for ordinary CI and
      # release preparation.
      max-parallel: 11
      matrix: ${{ fromJSON(needs.candidate.outputs.checks) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: candidate-bundle
          path: ${{ runner.temp }}/candidate
      - name: Run the check
        env:
          CHECK_ID: ${{ matrix.id }}
          CHECK_COMMAND: ${{ toJSON(matrix.command) }}
        run: |
          mapfile -t command < <(jq -r '.[]' <<<"$CHECK_COMMAND")
          bash dev/ci/periodic-e2e.sh check "$CHECK_ID" \
            "$RUNNER_TEMP/candidate/candidate-bundle.tar.gz" "${command[@]}"

  # Checks that boot a VM inside the leased VM, which runs inside the runner's VM. Hosted runners
  # are Azure Hyper-V VMs on either Intel or AMD CPUs, and the runner label cannot choose one. On
  # AMD, virtualization nested this deep under Hyper-V is so slow that these checks cannot finish:
  # the innermost VM's firmware alone takes 1.5 to over 4 minutes, and its guest agent did not
  # start within 5 to 15 minutes; on Intel it starts in 1.5 to 3.5 minutes. So these checks run only
  # on Intel. On AMD the job explains the skip, and the reschedule job runs the check again on new
  # runners until one is Intel.
  nested:
    name: "${{ matrix.copy && format('{0} #{1}', matrix.id, matrix.copy) || matrix.id }}"
    needs: [candidate, pool]
    if: >-
      ${{ !cancelled() && needs.candidate.outputs.nested && needs.candidate.result == 'success'
      && (needs.pool.result == 'success' || (needs.pool.result == 'skipped' && inputs.origin)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.candidate.outputs.nested) }}
    steps:
      - name: Require Intel, since nested VMs on AMD under Hyper-V are too slow for these checks
        id: cpu
        env:
          CHECK_ID: ${{ matrix.id }}
        run: |
          vendor="$(awk -F': *' '/^vendor_id/ {print $2; exit}' /proc/cpuinfo)"
          model="$(awk -F': *' '/^model name/ {print $2; exit}' /proc/cpuinfo)"
          printf 'cpu: %s (%s)\n' "$model" "$vendor"
          printf 'This check boots a VM inside the leased VM, inside this Hyper-V runner VM. On AMD that\n'
          printf 'nested virtualization is too slow for the check to finish, so it runs only on Intel.\n'
          if [ "$vendor" = GenuineIntel ]; then
            printf 'run=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf 'run=false\n' >> "$GITHUB_OUTPUT"
          reason="Not run on this $model runner. On AMD hosted runners a VM inside the leased VM boots far too slowly under the runner's Hyper-V for this check to finish: its firmware alone takes 1.5 to over 4 minutes, and its guest agent did not start within 5 to 15 minutes. The check is rescheduled on another runner."
          printf '::warning title=Rescheduled, nested VMs are too slow on AMD::%s\n' "$reason"
          printf '### %s\n%s\n' "$CHECK_ID" "$reason" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.cpu.outputs.run == 'true'
        with:
          persist-credentials: false
      - name: Set up Go
        if: steps.cpu.outputs.run == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        if: steps.cpu.outputs.run == 'true'
        with:
          name: candidate-bundle
          path: ${{ runner.temp }}/candidate
      - name: Run the check
        if: steps.cpu.outputs.run == 'true'
        env:
          CHECK_ID: ${{ matrix.id }}
          CHECK_COMMAND: ${{ toJSON(matrix.command) }}
        run: |
          mapfile -t command < <(jq -r '.[]' <<<"$CHECK_COMMAND")
          bash dev/ci/periodic-e2e.sh check "$CHECK_ID" \
            "$RUNNER_TEMP/candidate/candidate-bundle.tar.gz" "${command[@]}"

  # The only job allowed to start runs. It checks out nothing and runs no repository code.
  reschedule:
    needs: nested
    if: ${{ !cancelled() && needs.nested.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Retry nested VM checks that landed on AMD
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          REF: ${{ github.ref_name }}
          ORIGIN: ${{ inputs.origin || github.run_id }}
          ATTEMPT: ${{ inputs.attempt || 0 }}
        run: |
          # A nested job whose check step was skipped ran on AMD. A check is retried only when
          # every copy of it did.
          checks="$(gh api --paginate --slurp "repos/$GH_REPO/actions/runs/$RUN_ID/attempts/$RUN_ATTEMPT/jobs?per_page=100" \
            | jq -r '[.[].jobs[] | select(any(.steps[]; .name == "Require Intel, since nested VMs on AMD under Hyper-V are too slow for these checks" and .conclusion == "success"))
              | {id: (.name | sub(" #[0-9]+$"; "")),
                 ran: any(.steps[]; .name == "Run the check" and .conclusion != "skipped")}]
              | group_by(.id)[] | select(all(.[]; .ran | not)) | .[0].id' | sort | xargs)"
          if [ -z "$checks" ]; then
            printf 'Every nested VM check ran on an Intel runner.\n' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          attempt=$((ATTEMPT + 1))
          if [ "$attempt" -gt "$NESTED_ATTEMPTS" ]; then
            printf '::error title=Nested VM checks did not run::No Intel runner in %s attempts; not run: %s\n' \
              "$NESTED_ATTEMPTS" "$checks"
            exit 1
          fi
          gh workflow run periodic-e2e.yml --ref "$REF" -f checks="$checks" -f origin="$ORIGIN" \
            -f attempt="$attempt"
          printf 'Rescheduled on new runners at the latest %s commit, attempt %s of %s: %s\n\nSee the runs named "Nested VM checks on Intel, attempt N, for run %s".\n' \
            "$REF" "$attempt" "$NESTED_ATTEMPTS" "$checks" "$ORIGIN" >> "$GITHUB_STEP_SUMMARY"
