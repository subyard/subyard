name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    # Ubuntu 24.04 carries systemd 255, whose real parser guards the oldest
    # supported RestartForceExitStatus=/Type= compatibility boundary.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install system test tools
        run: sudo apt-get update -qq && sudo apt-get install -y gcc jq openssh-server ripgrep shellcheck zsh
      - name: ShellCheck
        run: |
          mapfile -t shell_files < <(find scripts dev config/profiles config/agents tests -type f -name '*.sh' -print | sort)
          shellcheck -x -S warning bin/yard completions/yard.bash "${shell_files[@]}"
      - name: Yard-safe verification gate
        run: ./tests/run.sh
      - name: Real local crypto and OpenSSH adapter contracts
        run: bash tests/real-host/adapter-contracts.sh
