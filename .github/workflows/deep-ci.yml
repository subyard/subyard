name: Deep CI

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deep-go:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install test tools
        run: sudo apt-get update -qq && sudo apt-get install -y gcc ripgrep
      - name: Repeated race tests
        run: go test -race -shuffle=on -count=3 ./...
      - name: Parser fuzzing
        run: go test ./internal/command -run '^$' -fuzz '^FuzzParseDoesNotPanic$' -fuzztime=60s
