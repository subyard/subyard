name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  native-engine-arm64:
    permissions:
      contents: read
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install engine test tools
        run: sudo apt-get update -qq && sudo apt-get install -y gcc jq ripgrep
      - name: Build and run native engine
        run: |
          dev/build-engine.sh
          .build/yard --version
      - name: Native engine tests
        run: go test -count=1 ./cmd/... ./internal/...

  paseo-headless:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # Include slow public downloads and all bounded network retries.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Install native bundle tools
        run: sudo apt-get update -qq && sudo apt-get install -y binutils build-essential jq xz-utils
      - name: Cache pinned npm downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build/paseo-npm-cache
          key: paseo-npm-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('config/agents/paseo/bundle/package-lock.json', 'dev/build-paseo-headless.sh') }}
          restore-keys: paseo-npm-${{ runner.os }}-${{ matrix.arch }}-
      - name: Build pinned Paseo headless bundle
        run: |
          artifact="$(dev/build-paseo-headless.sh --arch "${{ matrix.arch }}" --output-dir .build/paseo)"
          tests/native/paseo-headless.sh --artifact "$artifact"
      - uses: actions/upload-artifact@v7
        with:
          name: paseo-headless-${{ matrix.arch }}
          path: .build/paseo/*
          if-no-files-found: error
      - name: Preserve failed Paseo download diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-paseo-diagnostics-${{ matrix.arch }}-${{ github.run_attempt }}
          path: .build/paseo-diagnostics/
          retention-days: 7
          if-no-files-found: ignore

  publish:
    needs: [native-engine-arm64, paseo-headless]
    runs-on: ubuntu-24.04
    # Include full verification, packaging and released-updater compatibility.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install test tools
        run: sudo apt-get update -qq && sudo apt-get install -y gcc jq openssh-server ripgrep shellcheck zsh
      - name: Complete shipped profile acceptance inventory
        run: bash dev/test-profiles.sh --e2e --list
      - name: Verify release candidate
        run: |
          set -o pipefail
          mapfile -t shell_files < <(find scripts dev config/profiles config/agents tests -type f -name '*.sh' -print | sort)
          shellcheck -x -S warning bin/yard completions/yard.bash "${shell_files[@]}"
          mkdir -p .build/ci-logs
          make verify 2>&1 | tee .build/ci-logs/verify.log
      - name: CLI reference freshness
        run: make cli-docs-check
      - uses: actions/download-artifact@v8
        with:
          pattern: paseo-headless-*
          path: .build/release
          merge-multiple: true
      - name: Real local crypto and OpenSSH adapter contracts
        run: bash tests/real-host/adapter-contracts.sh
      - name: Build release assets
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            printf 'release tag must be stable semver: vMAJOR.MINOR.PATCH\n' >&2
            exit 2
          }
          version="${GITHUB_REF_NAME#v}"
          for arch in amd64 arm64; do
            dev/package-engine.sh --output-dir .build/release --version "$version" --arch "$arch"
          done
      - name: Verify released updater compatibility
        run: |
          set -o pipefail
          mkdir -p .build/ci-logs
          python3 dev/verify-release-upgrades.py --release-dir .build/release --version "${GITHUB_REF_NAME#v}" 2>&1 | tee .build/ci-logs/verify-release-upgrades.log
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          asset_list="$(mktemp)"
          dev/release-assets.sh --release-dir .build/release --version "$version" > "$asset_list"
          mapfile -t assets < "$asset_list"
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
            --verify-tag --generate-notes --title "Subyard ${GITHUB_REF_NAME#v}"
      - name: Preserve failed host-free diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-host-free-${{ github.run_attempt }}
          path: |
            .build/test-runs/
            .build/ci-logs/
          retention-days: 7
          if-no-files-found: ignore
