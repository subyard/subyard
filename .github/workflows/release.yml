name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  paseo-headless:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install native bundle tools
        run: sudo apt-get update -qq && sudo apt-get install -y binutils build-essential jq xz-utils
      - name: Build pinned Paseo headless bundle
        run: |
          artifact="$(dev/build-paseo-headless.sh --arch "${{ matrix.arch }}" --output-dir .build/paseo)"
          tests/native/paseo-headless.sh --artifact "$artifact"
      - uses: actions/upload-artifact@v4
        with:
          name: paseo-headless-${{ matrix.arch }}
          path: .build/paseo/*
          if-no-files-found: error

  publish:
    needs: paseo-headless
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install test tools
        run: sudo apt-get update -qq && sudo apt-get install -y gcc jq openssh-server ripgrep shellcheck zsh
      - name: Verify release candidate
        run: |
          mapfile -t shell_files < <(find scripts dev config/profiles config/agents tests -type f -name '*.sh' -print | sort)
          shellcheck -x -S warning bin/yard completions/yard.bash "${shell_files[@]}"
          ./tests/run.sh
      - uses: actions/download-artifact@v4
        with:
          pattern: paseo-headless-*
          path: .build/release
          merge-multiple: true
      - name: Real local crypto and OpenSSH adapter contracts
        run: bash tests/real-host/adapter-contracts.sh
      - name: Build release assets
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            printf 'release tag must be stable semver: vMAJOR.MINOR.PATCH\n' >&2
            exit 2
          }
          version="${GITHUB_REF_NAME#v}"
          for arch in amd64 arm64; do
            dev/package-engine.sh --output-dir .build/release --version "$version" --arch "$arch"
          done
      - name: Verify released updater compatibility
        run: python3 dev/verify-release-upgrades.py --release-dir .build/release --version "${GITHUB_REF_NAME#v}"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          asset_list="$(mktemp)"
          dev/release-assets.sh --release-dir .build/release --version "$version" > "$asset_list"
          mapfile -t assets < "$asset_list"
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
            --verify-tag --generate-notes --title "Subyard ${GITHUB_REF_NAME#v}"
