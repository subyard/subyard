name: Release preparation
run-name: Subyard ${{ inputs.request }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Final stable X.Y.Z (no tag is created)
        required: true
        type: string
      commit:
        description: Exact full source commit SHA
        required: true
        type: string
      request:
        description: Durable operator dispatch identity
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Validate pinned inputs
        env:
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ inputs.commit }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]]

  native-engine-arm64:
    needs: validate
    permissions:
      contents: read
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install engine test tools
        run: sudo apt-get update -qq && sudo apt-get install -y gcc jq ripgrep
      - name: Build and run native engine
        run: |
          dev/build-engine.sh
          dev/build-profiles.sh
          .build/yard --version
      - name: Native engine tests
        run: go test -count=1 ./cmd/... ./internal/...
      - name: Native AI Observer producer contract
        run: bash config/agents/aiobserver/tests/run.sh

  paseo-headless:
    name: paseo-headless-${{ matrix.arch }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # Include slow public downloads and all bounded network retries.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - name: Install native bundle tools
        run: sudo apt-get update -qq && sudo apt-get install -y binutils build-essential jq xz-utils
      - name: Cache pinned npm downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build/paseo-npm-cache
          key: paseo-npm-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('config/agents/paseo/bundle/package-lock.json', 'dev/build-paseo-headless.sh') }}
          restore-keys: paseo-npm-${{ runner.os }}-${{ matrix.arch }}-
      - name: Build pinned Paseo headless bundle
        run: |
          artifact="$(dev/build-paseo-headless.sh --arch "${{ matrix.arch }}" --output-dir .build/paseo)"
          tests/native/paseo-headless.sh --artifact "$artifact"
      - uses: actions/upload-artifact@v7
        with:
          name: paseo-headless-${{ matrix.arch }}-${{ github.run_attempt }}
          path: .build/paseo/*
          if-no-files-found: error
      - name: Preserve failed Paseo download diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-paseo-diagnostics-${{ matrix.arch }}-${{ github.run_attempt }}
          path: .build/paseo-diagnostics/
          retention-days: 7
          if-no-files-found: ignore

  prepare:
    needs: [native-engine-arm64, paseo-headless]
    runs-on: ubuntu-24.04
    # Include full verification, packaging and released-updater compatibility.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install test tools
        run: sudo apt-get update -qq && sudo apt-get install -y gcc jq openssh-server ripgrep shellcheck zsh
      - name: Complete shipped profile acceptance inventory
        run: bash dev/test-profiles.sh --e2e --list
      - name: Verify release candidate
        run: |
          set -o pipefail
          mapfile -t shell_files < <(find scripts dev config/profiles config/agents tests -type f -name '*.sh' -print | sort)
          shellcheck -x -S warning bin/yard completions/yard.bash "${shell_files[@]}"
          mkdir -p .build/ci-logs
          make verify 2>&1 | tee .build/ci-logs/verify.log
      - name: CLI reference freshness
        run: make cli-docs-check
      - uses: actions/download-artifact@v8
        with:
          pattern: paseo-headless-*-${{ github.run_attempt }}
          path: .build/release
          merge-multiple: true
      - name: Real local crypto and OpenSSH adapter contracts
        run: bash tests/real-host/adapter-contracts.sh
      - name: Build final-version release assets once
        env:
          VERSION: ${{ inputs.version }}
        run: |
          for arch in amd64 arm64; do
            dev/package-engine.sh --output-dir .build/release --version "$VERSION" --arch "$arch"
          done
      - name: Verify released updater compatibility
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -o pipefail
          mkdir -p .build/ci-logs
          python3 dev/verify-release-upgrades.py --release-dir .build/release --version "$VERSION" 2>&1 | tee .build/ci-logs/verify-release-upgrades.log
      - name: Freeze prepared source and exact assets
        env:
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ inputs.commit }}
          CANDIDATE: r${{ github.run_id }}-a${{ github.run_attempt }}
        run: |
          python3 -B dev/release-publication.py export-ci --output .build/prepared \
            --version "$VERSION" --commit "$COMMIT" --candidate "$CANDIDATE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-candidate-${{ github.run_attempt }}
          path: .build/prepared/
          if-no-files-found: error
          retention-days: 90
      - name: Preserve failed host-free diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-host-free-${{ github.run_attempt }}
          path: |
            .build/test-runs/
            .build/ci-logs/
          retention-days: 7
          if-no-files-found: ignore
