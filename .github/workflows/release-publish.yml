name: Release publication
run-name: Subyard ${{ inputs.request }}

on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Immutable preparation rRUN_ID-aATTEMPT
        required: true
        type: string
      attestation:
        description: Base64 sanitized trusted operator acceptance attestation
        required: true
        type: string
      request:
        description: Durable operator dispatch identity
        required: true
        type: string

# One stable publisher across all versions and operator machines. Preserve queued retries.
concurrency:
  group: subyard-release-publication-stable
  cancel-in-progress: false
  queue: max

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install source fingerprint tool
        run: sudo apt-get update -qq && sudo apt-get install -y ripgrep
      - name: Download exact successful preparation and operator attestation
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ inputs.candidate }}
          ATTESTATION: ${{ inputs.attestation }}
        run: |
          python3 -B - <<'PY'
          import base64, importlib.util, json, os
          from pathlib import Path
          spec = importlib.util.spec_from_file_location("publication", "dev/release-publication.py")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          prepared = Path(os.environ["RUNNER_TEMP"]) / "prepared"
          identity = module.fetch(module.GitHub(), os.environ["CANDIDATE"], prepared)
          attestation = json.loads(base64.b64decode(os.environ["ATTESTATION"], validate=True))
          module.write_json(Path(os.environ["RUNNER_TEMP"]) / "attestation.json", attestation)
          with open(os.environ["GITHUB_OUTPUT"], "a") as stream:
              stream.write("commit=" + identity["commit"] + "\n")
          PY
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.candidate.outputs.commit }}
          persist-credentials: false
      - name: Validate evidence, resume draft, verify bytes and publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -B dev/release-publication.py publish-ci \
            --prepared "$RUNNER_TEMP/prepared" --attestation "$RUNNER_TEMP/attestation.json"
