name: Veranda native client contracts

on:
  pull_request:
    paths: ['rust-toolchain.toml', 'veranda/**', 'api/yard-rpc/**', 'cmd/**', 'internal/**', 'go.mod', 'go.sum', 'dev/check-veranda*.py', 'dev/measure-veranda*.py', '.github/workflows/veranda.yml']
  push:
    branches: ['**']
    tags: ['v*']
    paths: ['rust-toolchain.toml', 'veranda/**', 'api/yard-rpc/**', 'cmd/**', 'internal/**', 'go.mod', 'go.sum', 'dev/check-veranda*.py', 'dev/measure-veranda*.py', '.github/workflows/veranda.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-client:
    name: Native client on ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, windows-2022, macos-14]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.build/veranda/target
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Set up native owner Go toolchain
        if: runner.os == 'Linux'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --no-self-update
      - name: Check Veranda host-free contracts
        env:
          RUSTUP_TOOLCHAIN: stable
        run: python dev/check-veranda.py

  gtk-desktop:
    name: Linux GTK desktop
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: stable
      CARGO_TARGET_DIR: ${{ github.workspace }}/.build/veranda-desktop/target
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install system GTK SDK
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libgtk-4-dev
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --no-self-update
      - name: Test GTK desktop models
        run: cargo test --manifest-path veranda/desktop/Cargo.toml --locked
      - name: Build GTK desktop
        run: cargo build --manifest-path veranda/desktop/Cargo.toml --locked
