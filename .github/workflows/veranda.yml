name: Veranda native client contracts

on:
  pull_request:
    paths: ['veranda/**', 'api/yard-rpc/**', 'dev/check-veranda*.py', 'dev/measure-veranda*.py', '.github/workflows/veranda.yml']
  push:
    branches: ['**']
    tags: ['v*']
    paths: ['veranda/**', 'api/yard-rpc/**', 'dev/check-veranda*.py', 'dev/measure-veranda*.py', '.github/workflows/veranda.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-client:
    name: Native client on ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, windows-2022, macos-14]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.build/veranda/target
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: Install Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal --no-self-update
      - name: Check Veranda host-free contracts
        env:
          RUSTUP_TOOLCHAIN: 1.88.0
        run: python dev/check-veranda.py
