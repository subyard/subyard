name: Dependency audit

on:
  schedule:
    - cron: '47 4 * * *'
  workflow_dispatch:
  push:
    paths:
      - go.mod
      - go.sum
      - veranda/*/Cargo.lock
      - .github/workflows/dependency-audit.yml

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Audit Go dependencies
        # Unlisted symbol findings and overdue allowlist reviews fail the job.
        run: bash dev/audit-go.sh
      - name: Check module files remain unchanged
        if: always()
        run: git diff --exit-code -- go.mod go.sum

  cargo-lockfiles:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Audit Rust dependencies with OSV-Scanner
        run: bash dev/audit-rust.sh
