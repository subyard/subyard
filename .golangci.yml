version: "2"

run:
  timeout: 5m

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  default: none
  enable:
    - exhaustive
    - forbidigo
    - staticcheck
    - unused
    - ineffassign
  settings:
    forbidigo:
      forbid:
        - pattern: '^os\.CreateTemp$'
          msg: 'publish files with safefs.WriteFile or safefs.Create'
        - pattern: '^os\.WriteFile$'
          msg: 'use safefs.WriteFile in product code or testkit.WriteFile in tests'
        - pattern: '^(t|tb|b)\.TempDir$'
          msg: 'use testkit.TempDir'
    staticcheck:
      checks: ["SA*", "S1*", "-QF*", "-ST*"]
    exhaustive:
      default-signifies-exhaustive: false
      # Types whose switches are complete state machines. Classification switches
      # over other enums deliberately end in a refusing default.
      only-types:
        - '.*releasetransition\.(JournalCheckpoint|StepCheckpoint|EvidenceCheckpoint|Direction|PublicStatus|Decision|ProcessMode|SourceIngressRequestKind|RecoveryProcessMode|JournalReplacementReason|RollbackCompatibility|OwnerRegistrationState|OwnerRegistrationProgress)$'
        - '.*migration\.(V1ImportRelease|V1ImportCheckpoint)$'
  exclusions:
    rules:
      - linters: [forbidigo]
        path-except: '^(internal/(adapters/(remotecontrol|credentialruntime|statusruntime|testvmsruntime|releaseruntime|sshagentruntime)|sshtrust|ownerservice|state|ownerinventory|audit|resourceendpoint|config|configsync|application|cli)|config/profiles/telemetry)/'
      # Profile Go code is linted for the file-primitive rules only.
      - linters: [exhaustive, staticcheck, unused, ineffassign]
        path: '^config/'
      - linters: [forbidigo]
        path: '_test\.go$'
        text: 'publish files with safefs'
      - linters: [forbidigo]
        path-except: '_test\.go$'
        text: 'use testkit\.TempDir'
