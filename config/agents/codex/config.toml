# Codex default config for the yard (config/agents.env → AGENT_codex_CONFIG).
# The container is the isolation boundary, so Codex runs with full local permissions and
# unrestricted network for free local work. Publishing git history is gated at the Codex
# level — canonical direct `git commit` and `git push` request operator approval via
# ~/.codex/rules/repo.rules and managed /etc/codex/requirements.toml. Customize defaults
# via AGENT_codex_CONFIG; native requirements retain user approval across projects/clients.
# `yard status` probes home rules; active client overrides still need runtime acceptance.

approval_policy = "on-request"   # run local commands freely; prompt on explicit command rules
approvals_reviewer = "user"      # commit/push prompts are routed to the operator
# Codex IDE 26.707 resolves Custom (config.toml) from this legacy key. Using the equivalent
# default_permissions profile here currently makes that UI path fall back to read-only.
sandbox_mode = "danger-full-access"

# Sudo is governed by DEV_SUDO (config/subyard.env), not gated here.
