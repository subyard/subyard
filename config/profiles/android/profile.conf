# Android toolchain and exclusive on-demand emulator pool. See docs/android.md.
PROFILE_NAME=android
PROJECT_ENV_BASE_IMAGE=subyard-android-env:1

# SDK is shared read-only; every L2 environment owns its writable Gradle cache.
CACHES=""
ANDROID_HOME=/srv/cache/android-sdk
ANDROID_SDK_ROOT=/srv/cache/android-sdk
GRADLE_USER_HOME=/home/dev/.gradle
YARD_GRADLE_USER_HOME=/srv/cache/gradle
JAVA_HOME=/opt/jdk-17
ANDROID_PUBLIC_ROOT=/srv/cache/android-sdk/.subyard
PATH=/srv/cache/android-sdk/.subyard/bin:/srv/cache/android-sdk/platform-tools:/srv/cache/android-sdk/cmdline-tools/latest/bin:/opt/jdk-17/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
ENV_MOUNTS="/srv/cache/android-sdk:/srv/cache/android-sdk:ro /opt/jdk-17:/opt/jdk-17:ro /usr/local/lib/subyard-android:/usr/local/lib/subyard-android:ro"

# Emulator hardware stays in the yard; L2 clients receive only the bounded pool facade.
DEVICES=""
YARD_DEVICES="kvm"
EMULATOR_SHARING=shared
EMULATOR_POOL_SIZE=2
EMULATOR_DEVICE=phone
# Use host with YARD_DEVICES="kvm gpu" for hardware rendering.
# software-gles disables guest Vulkan; software enables SwiftShader Vulkan as well.
EMULATOR_GPU=software-gles
ANDROID_API=36
ANDROID_VARIANT=google_apis
ANDROID_ABI=x86_64
JDK_VERSION=17
