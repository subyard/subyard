# Images are multi-architecture manifest digests verified against the public registries.
name: subyard-openlit
services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.4.1@sha256:2e6587b81a267c6152cf2112c3532516424d3eaa36f1b150d5b8847c0e3d5b01
    environment:
      CLICKHOUSE_USER: openlit
      CLICKHOUSE_PASSWORD: ${OPENLIT_DB_PASSWORD:?missing private database password}
      CLICKHOUSE_DB: openlit
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: '1'
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: [CMD-SHELL, 'clickhouse-client --user openlit --password "$${CLICKHOUSE_PASSWORD}" --query "SELECT 1"']
      interval: 5s
      timeout: 3s
      retries: 30
    mem_limit: 2g
    restart: unless-stopped
    logging: &logs
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  openlit:
    image: ghcr.io/openlit/openlit:2.1.0@sha256:94552ccd09379b5e2fec3c51c4fec1b41d88d6b56b0a5ccc895c116673884fa8
    environment:
      TELEMETRY_ENABLED: 'false'
      AUTH_TRUST_HOST: 'true'
      INIT_DB_HOST: clickhouse
      INIT_DB_PORT: '8123'
      INIT_DB_DATABASE: openlit
      INIT_DB_USERNAME: openlit
      INIT_DB_PASSWORD: ${OPENLIT_DB_PASSWORD:?missing private database password}
      SQLITE_DATABASE_URL: file:/app/client/data/data.db
      PORT: '3000'
      DOCKER_PORT: '3000'
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - openlit-data:/app/client/data
      - ./openlit-collector.yaml:/etc/otel/otel-collector-config.yaml:ro
    depends_on:
      clickhouse:
        condition: service_healthy
    healthcheck:
      # GET returns 405 only when the configured OTLP signal handler is listening.
      test: [CMD, node, -e, "Promise.all([fetch('http://localhost:3000'),fetch('http://localhost:4318/v1/logs'),fetch('http://localhost:4318/v1/metrics')]).then(([ui,logs,metrics])=>process.exit(ui.ok&&logs.status===405&&metrics.status===405?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 30
    mem_limit: 2g
    restart: unless-stopped
    logging: *logs
  collector:
    image: otel/opentelemetry-collector-contrib:0.162.0@sha256:39923a8e431bd1f57be82411999d389fcfe40857492e4365456d97a4c1f74be6
    command: [--config=/etc/otelcol-contrib/config.yaml]
    volumes:
      - ./collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - '127.0.0.1:4317:4317'
      - '127.0.0.1:4318:4318'
      - '127.0.0.1:13133:13133'
    depends_on:
      openlit:
        condition: service_healthy
    mem_limit: 256m
    restart: unless-stopped
    logging: *logs
volumes:
  clickhouse-data:
  openlit-data:
