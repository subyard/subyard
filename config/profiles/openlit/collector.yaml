receivers:
  otlp/grpc:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
  otlp/http:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
processors:
  resource/trace_cutover:
    attributes:
      - key: subyard.openlit.trace_cutover
        value: ${env:OPENLIT_TRACE_CUTOVER_ID}
        action: insert
  memory_limiter:
    check_interval: 1s
    limit_mib: 192
    spike_limit_mib: 48
  batch:
    timeout: 1s
    send_batch_size: 512
    send_batch_max_size: 1024
exporters:
  otlphttp/openlit:
    endpoint: http://openlit:4318
    timeout: 10s
    sending_queue:
      queue_size: 256
    retry_on_failure:
      initial_interval: 1s
      max_interval: 10s
      max_elapsed_time: 60s
extensions:
  health_check:
    endpoint: 0.0.0.0:13133
service:
  extensions: [health_check]
  pipelines:
    traces/http:
      receivers: [otlp/http]
      processors: [memory_limiter, resource/trace_cutover, batch]
      exporters: [otlphttp/openlit]
    traces/grpc:
      receivers: [otlp/grpc]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/openlit]
    logs:
      receivers: [otlp/grpc, otlp/http]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/openlit]
    metrics:
      receivers: [otlp/grpc, otlp/http]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/openlit]
