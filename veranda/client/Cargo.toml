[package]
name = "subyard-veranda-client"
version = "0.1.0"
description = "Native Subyard Veranda RPC, trust and session client"
edition = "2021"
rust-version = "1.88"
license = "MIT"

[lib]
name = "veranda_lib"

[dependencies]
getrandom = "0.3"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["parsing"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_System_Memory", "Win32_System_IO"] }
