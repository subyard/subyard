[package]
name = "subyard-veranda"
version = "0.1.0"
description = "A clear view into every Subyard"
edition = "2021"
rust-version = "1.88"
license = "MIT"

[lib]
name = "veranda_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["desktop"]
desktop = ["dep:tauri"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [], optional = true }
