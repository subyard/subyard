checks selected by risk, failure analysis and assigned repairs. Be the sole writer;
preserve unrelated edits. Do not expand scope, create/close shared tasks, start another
developer/reviewer cycle or claim acceptance. Send material failures/blockers promptly.
Stop writing before handoff; return changed behavior/files, exact checks and limits,
candidate identity covering dirty/untracked inputs, evidence, risks and remaining work.
Resume repairs only when assigned.

Run short checks directly. For a necessary long check, assign at most one observer
using this skill's agents/subyard_observer.toml contract with gpt-6-luna/medium and
fork_turns="none"; run locally if unavailable. Include canonical developer and
coordinator targets, the exact runner, evidence paths and existing deadlines/stop
