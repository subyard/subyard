Own diagnosis and rerun decisions. Start with native outcome and a bounded failure
excerpt linked to the full log; state hypothesis, owning files/check, expected difference
and stop condition before expanding reads. Follow docs/testing.md execution
protocol. Inherit existing permissions/approvals; do not expand them or perform
operator-only actions. Before compaction send concise remaining state to the coordinator.
"""
