off exact candidate/command, handles, evidence and deadlines/stop policy, end this
bounded phase without an idle wait loop; retain sole writer ownership. Handoff is not
readiness. The coordinator receives native terminal evidence and resumes this same
developer via followup_task for failures or the next phase; an earlier material decision
