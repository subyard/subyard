<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="506" viewBox="0 0 1000 506" role="img" aria-labelledby="title desc">
  <title id="title">Agents and shared service environments across your machines</title>
  <desc id="desc">A laptop and server each contain multiple yards. Within project and service yards, several agents use shared staging environments to reproduce and test a product. A dedicated test yard contains a broker that leases test virtual machines. The hosts support SSH management, shared settings through Git, and encrypted staging credential exchange. Projects, sessions, and caches persist.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#64748b"/></marker>
  </defs>
  <rect width="1000" height="506" rx="12" fill="#f6f8fa"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <!-- Laptop: each yard includes agents and the environments they share. -->
    <rect x="26" y="26" width="374" height="420" rx="12" fill="#fff" stroke="#64748b" stroke-width="2"/>
    <text x="48" y="61" font-size="22" font-weight="650" fill="#0f172a">Your laptop</text>
    <circle cx="376" cy="53" r="4" fill="#0f766e"/>

    <rect x="46" y="82" width="334" height="158" rx="6" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
    <text x="62" y="110" font-size="20" font-weight="600" fill="#115e59">Yard A</text>
    <text x="364" y="110" text-anchor="end" font-size="14" fill="#475569">Container · image A</text>
    <rect x="62" y="125" width="141" height="32" rx="4" fill="#fff" stroke="#b6d8d1"/>
    <rect x="223" y="125" width="141" height="32" rx="4" fill="#fff" stroke="#b6d8d1"/>
    <text x="132" y="147" text-anchor="middle" font-size="16" fill="#0f172a">Agent + code</text>
    <text x="294" y="147" text-anchor="middle" font-size="16" fill="#0f172a">Agent + code</text>
    <path d="M132 157V178" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/>
    <path d="M294 157V178" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/>
    <rect x="62" y="181" width="302" height="42" rx="4" fill="#ccfbf1" stroke="#8bc5b8"/>
    <text x="213" y="208" text-anchor="middle" font-size="17" font-weight="500" fill="#115e59">Shared service environment</text>

    <rect x="46" y="252" width="334" height="164" rx="6" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
    <text x="62" y="280" font-size="20" font-weight="600" fill="#115e59">Yard B</text>
    <text x="364" y="280" text-anchor="end" font-size="14" fill="#475569">Container · image B</text>
    <rect x="62" y="295" width="141" height="32" rx="4" fill="#fff" stroke="#b6d8d1"/>
    <rect x="223" y="295" width="141" height="32" rx="4" fill="#fff" stroke="#b6d8d1"/>
    <text x="132" y="317" text-anchor="middle" font-size="16" fill="#0f172a">Agent + code</text>
    <text x="294" y="317" text-anchor="middle" font-size="16" fill="#0f172a">Agent + code</text>
    <path d="M132 327V348" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/>
    <path d="M294 327V348" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/>
    <rect x="62" y="351" width="302" height="48" rx="4" fill="#ccfbf1" stroke="#8bc5b8"/>
    <text x="213" y="381" text-anchor="middle" font-size="17" font-weight="500" fill="#115e59">Shared staging + tests</text>

    <path d="M26 446H400L416 457Q416 464 402 464H24Q10 464 10 457Z" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
    <path d="M169 446H257L250 453H176Z" fill="#94a3b8"/>

    <!-- Host connections do not imply automatic agent scheduling. -->
    <text x="500" y="120" text-anchor="middle" font-size="18" font-weight="600" fill="#334155">SSH</text>
    <path d="M414 139H586" fill="none" stroke="#64748b" stroke-width="1.7" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="500" y="165" text-anchor="middle" font-size="16" fill="#475569">Manage remote yards</text>
    <text x="500" y="290" text-anchor="middle" font-size="16" font-weight="600" fill="#334155">Settings via Git</text>
    <path d="M414 309H586" fill="none" stroke="#64748b" stroke-width="1.7" stroke-dasharray="5 4" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="500" y="337" text-anchor="middle" font-size="16" fill="#475569">Encrypted staging</text>
    <text x="500" y="359" text-anchor="middle" font-size="16" fill="#475569">credentials</text>

    <!-- Server: a service yard and a dedicated yard for leased test hosts. -->
    <rect x="600" y="26" width="374" height="438" rx="12" fill="#fff" stroke="#64748b" stroke-width="2"/>
    <text x="622" y="61" font-size="22" font-weight="650" fill="#0f172a">Your server / VPS</text>
    <circle cx="950" cy="53" r="4" fill="#0f766e"/>

    <rect x="620" y="82" width="334" height="202" rx="6" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
    <text x="636" y="110" font-size="20" font-weight="600" fill="#115e59">Service yard</text>
    <text x="938" y="110" text-anchor="end" font-size="14" fill="#475569">Container / VM</text>
    <rect x="636" y="125" width="141" height="32" rx="4" fill="#fff" stroke="#b6d8d1"/>
    <rect x="797" y="125" width="141" height="32" rx="4" fill="#fff" stroke="#b6d8d1"/>
    <text x="706" y="147" text-anchor="middle" font-size="16" fill="#0f172a">Agent + code</text>
    <text x="868" y="147" text-anchor="middle" font-size="16" fill="#0f172a">Agent + code</text>
    <path d="M706 157V182" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/>
    <path d="M868 157V182" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/>
    <rect x="636" y="185" width="302" height="79" rx="4" fill="#ccfbf1" stroke="#8bc5b8"/>
    <text x="787" y="214" text-anchor="middle" font-size="18" font-weight="600" fill="#115e59">Shared staging</text>
    <text x="787" y="241" text-anchor="middle" font-size="16" fill="#115e59">Your services · integration tests</text>

    <rect x="620" y="296" width="334" height="148" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="636" y="324" font-size="20" font-weight="600" fill="#334155">Test yard</text>
    <text x="938" y="324" text-anchor="end" font-size="14" fill="#64748b">opt-in · prepared host</text>
    <rect x="636" y="340" width="118" height="44" rx="4" fill="#fff" stroke="#cbd5e1"/>
    <text x="695" y="368" text-anchor="middle" font-size="17" font-weight="500" fill="#334155">Broker</text>
    <path d="M756 362H794" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="797" y="340" width="141" height="44" rx="4" fill="#fff" stroke="#cbd5e1"/>
    <text x="867" y="368" text-anchor="middle" font-size="17" font-weight="500" fill="#334155">Test VMs</text>
    <text x="787" y="416" text-anchor="middle" font-size="16" fill="#475569">Acquire · verify · release</text>

    <text x="500" y="491" text-anchor="middle" font-size="16" font-weight="500" fill="#475569">Persistent projects, sessions, and caches · Shared services · One CLI</text>
  </g>
</svg>
